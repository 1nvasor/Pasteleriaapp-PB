{% extends 'pasteleriaapp/base.html' %}

{% block title %}Iniciar sesión - Pastelería Dulce Sabor{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-header bg-white py-3 text-center">
                <h4 class="card-title mb-0 fw-bold" style="color:#d63384;">
                    <i class="bi bi-person-lock me-2"></i>Iniciar sesión
                </h4>
            </div>
            <div class="card-body p-4">
                <form method="post" novalidate>
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ next }}">

                    {% if form.errors %}
                        <div class="alert alert-danger py-2 small">
                            Usuario o contraseña incorrectos. Inténtalo nuevamente.
                        </div>
                    {% endif %}

                    <div class="mb-3">
                        <label for="id_username" class="form-label fw-bold">Usuario</label>
                        <input type="text" name="username" id="id_username"
                               class="form-control" placeholder="Ingresa tu usuario"
                               value="{{ form.username.value|default:'' }}"
                               autocomplete="username" autofocus required>
                    </div>

                    <div class="mb-3">
                        <label for="id_password" class="form-label fw-bold">Contraseña</label>
                        <input type="password" name="password" id="id_password"
                               class="form-control" placeholder="Ingresa tu contraseña"
                               autocomplete="current-password" required>
                    </div>

                    <button type="submit" class="btn btn-pasteleria w-100 mt-2">Ingresar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
